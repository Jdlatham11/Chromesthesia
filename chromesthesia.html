<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromesthesia Cosmos</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        
        body {
            margin: 0; height: 100vh;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            padding-bottom: 50px; font-family: sans-serif;
            overflow: hidden; position: relative;
        }

        .back-btn {
            position: absolute; top: 30px; left: 30px;
            color: rgba(255, 255, 255, 0.4); text-decoration: none;
            font-size: 28px; z-index: 100; transition: color 0.2s ease, transform 0.2s ease;
        }
        .back-btn:hover { color: #ffffff; transform: translateX(-5px); }

        #visualizer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        
        .ui-container { display: flex; flex-direction: column; gap: 24px; align-items: center; z-index: 10; width: 100%; }

        .patch-selector { display: flex; gap: 12px; }
        .patch-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.6); padding: 8px 16px; border-radius: 20px;
            cursor: pointer; transition: all 0.2s; font-size: 13px; font-weight: 600;
            backdrop-filter: blur(4px); letter-spacing: 0.5px;
        }
        .patch-btn.active, .patch-btn:hover {
            background: rgba(255,255,255,0.9); color: #121212; border-color: #ffffff;
        }

        .volume-container {
            width: 200px; height: 3px; background: rgba(255, 255, 255, 0.15);
            border-radius: 4px; position: relative; transition: height 0.2s ease, background 0.2s ease;
        }
        .volume-container:hover { height: 14px; background: rgba(255, 255, 255, 0.25); }
        .volume-bar {
            height: 100%; width: 50%; background: #ffffff; border-radius: 4px;
            pointer-events: none; transition: width 0.1s linear;
        }
        .volume-container input {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer; margin: 0;
        }

        .keyboard { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .row { display: flex; gap: 16px; justify-content: center; }
        
        .pad {
            width: 68px; height: 68px; border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15); color: rgba(255, 255, 255, 0.4);
            display: flex; align-items: center; justify-content: center;
            font-size: 19px; font-weight: 600; background: rgba(18, 18, 18, 0.6);
            backdrop-filter: blur(4px); transition: transform 0.08s ease, background 0.08s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); cursor: pointer;
        }
        
        .pad.spacer { visibility: hidden; width: 34px; }
        
        .pad.active {
            background: #ffffff; color: #121212; border-color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.8); transform: scale(0.92);
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">&#8592;</a>
    <canvas id="visualizer"></canvas>

    <div class="ui-container">
        <div class="patch-selector">
            <button class="patch-btn active" data-patch="cosmos">Cosmos</button>
            <button class="patch-btn" data-patch="saw">Neon Saw</button>
            <button class="patch-btn" data-patch="ghost">Ghost Choir</button>
            <button class="patch-btn" data-patch="pluck">8-Bit Pluck</button>
        </div>

        <div class="volume-container">
            <div class="volume-bar" id="vol-bar"></div>
            <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.5">
        </div>

        <div class="keyboard">
            <div class="row">
                <div class="pad" data-key="w">W</div><div class="pad" data-key="e">E</div>
                <div class="pad spacer"></div>
                <div class="pad" data-key="t">T</div><div class="pad" data-key="y">Y</div><div class="pad" data-key="u">U</div>
                <div class="pad spacer"></div>
                <div class="pad" data-key="o">O</div>
            </div>
            <div class="row">
                <div class="pad" data-key="a">A</div><div class="pad" data-key="s">S</div><div class="pad" data-key="d">D</div>
                <div class="pad" data-key="f">F</div><div class="pad" data-key="g">G</div><div class="pad" data-key="h">H</div><div class="pad" data-key="j">J</div>
            </div>
        </div>
    </div>

    <script>
        // Chromatic Scale Mapping (C4 to C5)
        const notes = {
            'a': { freq: 261.63, color: '#ff2a2a' }, // C
            'w': { freq: 277.18, color: '#ff5e2a' }, // C#
            's': { freq: 293.66, color: '#ffaa00' }, // D
            'e': { freq: 311.13, color: '#d4c919' }, // D#
            'd': { freq: 329.63, color: '#84e527' }, // E
            'f': { freq: 349.23, color: '#27e57c' }, // F
            't': { freq: 369.99, color: '#27e5d4' }, // F#
            'g': { freq: 392.00, color: '#1a75ff' }, // G
            'y': { freq: 415.30, color: '#5e1aff' }, // G#
            'h': { freq: 440.00, color: '#b829ff' }, // A
            'u': { freq: 466.16, color: '#ff29d4' }, // A#
            'j': { freq: 493.88, color: '#ff5e5e' }, // B
            'o': { freq: 523.25, color: '#ffffff' }  // C5 (Octave Up)
        };

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx, masterGain, convolver;
        const activeOscillators = {};
        const currentlyHeldKeys = new Set();
        
        let globalVolume = 0.5;
        let currentPatch = 'cosmos';

        // UI Event Listeners
        document.querySelectorAll('.patch-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.patch-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentPatch = e.target.getAttribute('data-patch');
            });
        });

        const volSlider = document.getElementById('vol-slider');
        const volBar = document.getElementById('vol-bar');
        volSlider.addEventListener('input', (e) => {
            globalVolume = parseFloat(e.target.value);
            volBar.style.width = (globalVolume * 100) + '%';
            if (masterGain) masterGain.gain.setValueAtTime(globalVolume, audioCtx.currentTime);
        });

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new AudioContext();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = globalVolume;

            convolver = audioCtx.createConvolver();
            const length = audioCtx.sampleRate * 2.8;
            const impulse = audioCtx.createBuffer(2, length, audioCtx.sampleRate);
            for (let i = 0; i < length; i++) {
                const decay = Math.pow(1 - i / length, 2.5);
                impulse.getChannelData(0)[i] = (Math.random() * 2 - 1) * decay;
                impulse.getChannelData(1)[i] = (Math.random() * 2 - 1) * decay;
            }
            convolver.buffer = impulse;
            masterGain.connect(convolver);
            convolver.connect(audioCtx.destination);
            masterGain.connect(audioCtx.destination);
        }

        function playNote(key) {
            initAudio();
            if (activeOscillators[key] || !notes[key]) return;
            
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            const freq = notes[key].freq;
            const now = audioCtx.currentTime;

            if (currentPatch === 'cosmos') {
                osc1.type = 'triangle'; osc2.type = 'sine';
                osc1.frequency.value = freq; osc2.frequency.value = freq + 1.2;
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.25, now + 0.3);
                filter.type = 'lowpass'; filter.frequency.value = 900;
            } 
            else if (currentPatch === 'saw') {
                osc1.type = 'sawtooth'; osc2.type = 'sawtooth';
                osc1.frequency.value = freq; osc2.frequency.value = freq * 1.01;
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.15, now + 0.1);
                filter.type = 'lowpass'; filter.frequency.value = 2500;
                filter.frequency.exponentialRampToValueAtTime(500, now + 0.5);
            }
            else if (currentPatch === 'ghost') {
                osc1.type = 'sine'; osc2.type = 'sine';
                osc1.frequency.value = freq; osc2.frequency.value = freq * 2; // Octave up
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.25, now + 0.8); // Slow attack
                filter.type = 'lowpass'; filter.frequency.value = 800;
            }
            else if (currentPatch === 'pluck') {
                osc1.type = 'square'; osc2.type = 'square';
                osc1.frequency.value = freq; osc2.frequency.value = freq / 2; // Octave down
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.2, now + 0.05); // Sharp attack
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.6); // Fast decay
                filter.type = 'lowpass'; filter.frequency.value = 1500;
            }

            osc1.connect(filter); osc2.connect(filter); 
            filter.connect(gainNode); gainNode.connect(masterGain);
            osc1.start(); osc2.start();
            
            activeOscillators[key] = { osc1, osc2, gainNode };
        }

        function stopNote(key) {
            if (!activeOscillators[key]) return;
            const { osc1, osc2, gainNode } = activeOscillators[key];
            const now = audioCtx.currentTime;
            
            gainNode.gain.cancelScheduledValues(now);
            gainNode.gain.setValueAtTime(gainNode.gain.value, now);
            
            let releaseTime = currentPatch === 'ghost' ? 1.5 : 0.8;
            gainNode.gain.linearRampToValueAtTime(0.0001, now + releaseTime);
            
            osc1.stop(now + releaseTime); osc2.stop(now + releaseTime);
            delete activeOscillators[key];
        }

        // --- VISUALS ---
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        
        let sortedKeys = Object.keys(notes).sort((a, b) => notes[a].freq - notes[b].freq);
        let keyPositions = {};

        function resizeCanvas() { 
            canvas.width = window.innerWidth; canvas.height = window.innerHeight; 
            
            sortedKeys.forEach((key, index) => {
                let progress = index / (sortedKeys.length - 1); 
                let archY = 0.8 - (Math.pow(progress, 1.5) * 0.6);
                keyPositions[key] = {
                    rx: 0.15 + (progress * 0.7), 
                    baseRy: archY,
                    currentRy: archY,
                    currentScale: 0
                };
            });
        }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        const bgStars = [];
        for(let i = 0; i < 150; i++) {
            bgStars.push({
                x: Math.random(), y: Math.random(), radius: Math.random() * 1.5,
                alpha: Math.random(), speed: (Math.random() * 0.01) - 0.005 
            });
        }

        const satellites = [
            { x: Math.random() * window.innerWidth, y: Math.random() * (window.innerHeight/2), vx: 0.2, vy: 0.05 },
            { x: Math.random() * window.innerWidth, y: Math.random() * (window.innerHeight/2), vx: -0.15, vy: -0.08 }
        ];

        let shootingStar = { active: false, x: 0, y: 0, vx: 0, vy: 0, length: 0, opacity: 0 };
        function spawnShootingStar() {
            if (Math.random() < 0.002 && !shootingStar.active) {
                shootingStar = {
                    active: true, x: Math.random() * window.innerWidth, y: Math.random() * (window.innerHeight / 2),
                    vx: (Math.random() * 8) + 4 * (Math.random() > 0.5 ? 1 : -1), vy: (Math.random() * 4) + 2,
                    length: 0, opacity: 1
                };
            }
        }

        const asteroids = [];
        for(let i=0; i<2; i++) {
            let vertices = [];
            let numPoints = 5 + Math.floor(Math.random() * 3);
            for(let p=0; p<numPoints; p++) {
                let angle = (p / numPoints) * Math.PI * 2;
                let rad = 15 + Math.random() * 15;
                vertices.push({x: Math.cos(angle) * rad, y: Math.sin(angle) * rad});
            }
            asteroids.push({
                x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight,
                vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
                angle: 0, rotSpeed: (Math.random() - 0.5) * 0.02, vertices: vertices
            });
        }

        function drawFlare(x, y, scale, color) {
            ctx.save();
            ctx.translate(x, y); ctx.scale(scale, scale);
            ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2);
            ctx.fillStyle = color; ctx.globalAlpha = 0.3; ctx.fill();
            ctx.globalAlpha = 1.0;
            ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff'; ctx.fill();
            ctx.fillStyle = color; ctx.globalAlpha = 0.9;
            ctx.beginPath(); ctx.moveTo(-1.5, 0); ctx.lineTo(0, -220); ctx.lineTo(1.5, 0); ctx.lineTo(0, 220); ctx.closePath(); ctx.fill();
            ctx.beginPath(); ctx.moveTo(0, -1.5); ctx.lineTo(-220, 0); ctx.lineTo(0, 1.5); ctx.lineTo(220, 0); ctx.closePath(); ctx.fill();
            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter'; 

            bgStars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha >= 1) { star.alpha = 1; star.speed *= -1; }
                if (star.alpha <= 0) { star.alpha = 0; star.speed *= -1; }
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fillRect(star.x * canvas.width, star.y * canvas.height, star.radius, star.radius);
            });

            satellites.forEach(sat => {
                sat.x += sat.vx; sat.y += sat.vy;
                if (sat.x > canvas.width) sat.x = 0; if (sat.x < 0) sat.x = canvas.width;
                if (sat.y > canvas.height) sat.y = 0; if (sat.y < 0) sat.y = canvas.height;
                ctx.beginPath(); ctx.arc(sat.x, sat.y, 1.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)'; ctx.fill();
            });

            ctx.globalCompositeOperation = 'source-over'; 
            asteroids.forEach(ast => {
                ast.x += ast.vx; ast.y += ast.vy; ast.angle += ast.rotSpeed;
                if (ast.x > canvas.width + 50) ast.x = -50; if (ast.x < -50) ast.x = canvas.width + 50;
                if (ast.y > canvas.height + 50) ast.y = -50; if (ast.y < -50) ast.y = canvas.height + 50;
                ctx.save(); ctx.translate(ast.x, ast.y); ctx.rotate(ast.angle);
                ctx.beginPath();
                ast.vertices.forEach((v, i) => { if (i === 0) ctx.moveTo(v.x, v.y); else ctx.lineTo(v.x, v.y); });
                ctx.closePath();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)'; ctx.lineWidth = 1; ctx.stroke();
                ctx.fillStyle = 'rgba(15, 20, 25, 0.4)'; ctx.fill();
                ctx.restore();
            });

            ctx.globalCompositeOperation = 'lighter';
            spawnShootingStar();
            if (shootingStar.active) {
                shootingStar.x += shootingStar.vx; shootingStar.y += shootingStar.vy;
                shootingStar.length = Math.min(shootingStar.length + 5, 80);
                shootingStar.opacity -= 0.015;
                if (shootingStar.opacity <= 0) shootingStar.active = false;
                ctx.beginPath(); ctx.moveTo(shootingStar.x, shootingStar.y);
                let tailX = shootingStar.x - (shootingStar.vx * (shootingStar.length / 10));
                let tailY = shootingStar.y - (shootingStar.vy * (shootingStar.length / 10));
                ctx.lineTo(tailX, tailY);
                ctx.strokeStyle = `rgba(255, 255, 255, ${Math.max(0, shootingStar.opacity)})`;
                ctx.lineWidth = 2; ctx.stroke();
            }

            // Rising Notes Engine
            for (let key in keyPositions) {
                let isActive = currentlyHeldKeys.has(key);
                let star = keyPositions[key];
                
                if (isActive) {
                    star.currentScale += (1.0 - star.currentScale) * 0.15; 
                    star.currentRy -= 0.003; // Drift upward while pressed
                } else {
                    star.currentScale += (0 - star.currentScale) * 0.1; // Fade out rapidly
                }
                
                if (star.currentScale > 0.01) {
                    drawFlare(star.rx * canvas.width, star.currentRy * canvas.height, star.currentScale, notes[key].color);
                }
            }

            requestAnimationFrame(animate);
        }
        animate();

        function activatePad(key) {
            const pad = document.querySelector(`.pad[data-key="${key}"]`);
            if (!pad || !notes[key] || currentlyHeldKeys.has(key)) return;
            pad.classList.add('active');
            
            // Reset visual position to the arch base on strike
            if (keyPositions[key]) keyPositions[key].currentRy = keyPositions[key].baseRy;
            
            playNote(key); currentlyHeldKeys.add(key);
        }

        function deactivatePad(key) {
            const pad = document.querySelector(`.pad[data-key="${key}"]`);
            if (!pad) return;
            pad.classList.remove('active');
            stopNote(key); currentlyHeldKeys.delete(key);
        }

        document.addEventListener('keydown', (e) => { if (!e.repeat) activatePad(e.key.toLowerCase()); });
        document.addEventListener('keyup', (e) => deactivatePad(e.key.toLowerCase()));
        
        document.querySelectorAll('.pad[data-key]').forEach(pad => {
            const key = pad.getAttribute('data-key');
            pad.addEventListener('mousedown', () => activatePad(key));
            pad.addEventListener('mouseup', () => deactivatePad(key));
            pad.addEventListener('mouseleave', () => deactivatePad(key));
            pad.addEventListener('touchstart', (e) => { e.preventDefault(); activatePad(key); });
            pad.addEventListener('touchend', (e) => { e.preventDefault(); deactivatePad(key); });
        });
    </script>
</body>
</html>
