<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Machine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background-color: #000000;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .back-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 28px;
            z-index: 100;
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .back-btn:hover {
            color: #ffffff;
            transform: translateX(-5px);
        }

        .slot-machine-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        /* Left Column: Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .arrow-btn {
            width: 56px;
            height: 56px;
            background: #1e1e1e;
            border: 2px solid #555;
            border-radius: 10px;
            color: #ccc;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
        }
        .arrow-btn:hover {
            background: #333;
            color: #fff;
            border-color: #888;
        }
        .arrow-btn:active {
            transform: scale(0.95);
        }

        /* Center Column: Slot Window & 3D Wheel */
        .slot-window {
            width: 300px;
            height: 220px;
            perspective: 1000px;
            overflow: hidden;
            border: 3px solid #555;
            border-radius: 12px;
            background: #0a0a0a;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05), inset 0 0 40px rgba(0, 0, 0, 0.9);
        }

        .wheel {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 3s cubic-bezier(0.15, 0.85, 0.15, 1);
        }

        .panel {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #2a2a2a;
            border: 2px solid #c0c0c0;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.7);
            transform: rotateX(calc(72deg * var(--index))) translateZ(150px);
            backface-visibility: hidden;
        }

        /* Right Column: Lever */
        .lever-container {
            width: 60px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 600px;
            cursor: pointer;
        }

        .lever {
            position: relative;
            width: 14px;
            height: 140px;
            background: linear-gradient(to right, #888, #ddd, #888);
            border-radius: 7px;
            transform-origin: bottom center;
            transform-style: preserve-3d;
        }

        .lever-knob {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 38px;
            height: 38px;
            background: radial-gradient(circle at 30% 30%, #ff4d4d, #cc0000 70%, #660000 100%);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
        }

        .lever-base {
            position: absolute;
            bottom: 30px;
            width: 32px;
            height: 44px;
            background: #333;
            border: 2px solid #666;
            border-radius: 6px;
            z-index: -1;
        }

        .pulled .lever {
            animation: pullLever 0.6s ease-in-out;
        }

        @keyframes pullLever {
            0% { transform: rotateX(0deg); }
            50% { transform: rotateX(60deg); }
            100% { transform: rotateX(0deg); }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">&#8592;</a>

    <div class="slot-machine-container">
        <div class="controls">
            <button class="arrow-btn" id="up-btn" aria-label="Spin Up">&#9650;</button>
            <button class="arrow-btn" id="down-btn" aria-label="Spin Down">&#9660;</button>
        </div>

        <div class="slot-window">
            <div class="wheel" id="wheel">
                <div class="panel" style="--index: 0;"></div>
                <div class="panel" style="--index: 1;"></div>
                <div class="panel" style="--index: 2;"></div>
                <div class="panel" style="--index: 3;"></div>
                <div class="panel" style="--index: 4;"></div>
            </div>
        </div>

        <div class="lever-container" id="lever-container">
            <div class="lever" id="lever">
                <div class="lever-knob"></div>
            </div>
            <div class="lever-base"></div>
        </div>
    </div>

    <script>
        const wheel = document.getElementById('wheel');
        const upBtn = document.getElementById('up-btn');
        const downBtn = document.getElementById('down-btn');
        const leverContainer = document.getElementById('lever-container');
        const lever = document.getElementById('lever');

        let currentRotation = 0;

        upBtn.addEventListener('click', () => {
            currentRotation -= 72;
            wheel.style.transition = 'transform 0.3s cubic-bezier(0.15, 0.85, 0.15, 1)';
            wheel.style.transform = `rotateX(${currentRotation}deg)`;
        });

        downBtn.addEventListener('click', () => {
            currentRotation += 72;
            wheel.style.transition = 'transform 0.3s cubic-bezier(0.15, 0.85, 0.15, 1)';
            wheel.style.transform = `rotateX(${currentRotation}deg)`;
        });

        leverContainer.addEventListener('click', () => {
            leverContainer.classList.add('pulled');

            wheel.style.transition = 'transform 3s cubic-bezier(0.15, 0.85, 0.15, 1)';
            const randomNotches = Math.floor(Math.random() * 5) * 72;
            currentRotation += (360 * 5) + randomNotches;
            wheel.style.transform = `rotateX(${currentRotation}deg)`;
        });

        lever.addEventListener('animationend', () => {
            leverContainer.classList.remove('pulled');
        });
    </script>
</body>
</html>
