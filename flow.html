<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Flow of How We Know</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Shrikhand&family=Itim&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #f4ecd8; /* Vintage Parchment */
            color: #2d2d2a;
            font-family: 'Itim', cursive, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        .back-btn {
            position: absolute; top: 30px; left: 30px;
            color: #2d2d2a; text-decoration: none; font-size: 28px;
            z-index: 1000; transition: transform 0.2s ease;
            font-family: sans-serif; font-weight: bold;
        }
        .back-btn:hover { transform: translateX(-5px); }

        h1 {
            font-family: 'Shrikhand', cursive;
            font-size: clamp(3rem, 5vw, 6rem); /* Scales nicely on smaller screens */
            color: #c14953; /* Faded Brick Red */
            text-shadow: 3px 3px 0px #2d2d2a;
            margin-bottom: 15px;
        }

        .wip-text {
            font-size: 1.5rem;
            color: #3a5a80; /* Denim Blue */
            opacity: 0.8;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">&#8592;</a>

    <h1>THE FLOW OF HOW WE KNOW</h1>
    <p class="wip-text">(Still Working On This...)</p>

</body>
</html>
