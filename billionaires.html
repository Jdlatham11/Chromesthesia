<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Facts About Billionaires!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }

        body {
            /* Muted landscape horizon background */
            background: linear-gradient(to bottom, #a1c4fd 0%, #c2e9fb 40%, #e0c3fc 70%, #8ec5fc 100%);
            color: #2d3436;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        .back-btn {
            position: absolute; top: 20px; left: 20px;
            color: #2d3436; text-decoration: none; font-size: 28px;
            z-index: 1000; transition: transform 0.2s ease; font-weight: bold;
        }
        .back-btn:hover { transform: translateX(-5px); }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem; color: #fff;
            text-shadow: 2px 2px 0px #2d3436;
            margin-top: 15px; z-index: 10;
        }

        /* --- BACKGROUND DOLLAR BILLS --- */
        .money-rain { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
        .bill {
            position: absolute; color: rgba(46, 204, 113, 0.4); font-size: 2rem; font-weight: bold;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0); }
            50% { transform: translateY(50vh) rotate(180deg) translateX(50px); }
            100% { transform: translateY(110vh) rotate(360deg) translateX(-50px); }
        }

        /* --- MAIN LAYOUT --- */
        .dashboard {
            display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 1200px;
            flex-grow: 1; z-index: 10; padding: 10px;
        }

        /* --- THE CHARTS (TOP) --- */
        .charts-container {
            display: flex; justify-content: space-around; width: 100%; height: 35vh; margin-top: 10px;
        }
        .chart-box {
            background: rgba(255, 255, 255, 0.85); border-radius: 15px; padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 45%;
            display: flex; flex-direction: column; align-items: center; position: relative;
        }
        .chart-title { font-family: 'Fredoka One', cursive; font-size: 1.1rem; margin-bottom: 5px; color: #2c3e50; }
        svg { width: 100%; height: 100%; overflow: visible; }
        .slice { transition: all 0.5s ease-in-out; cursor: pointer; }
        .slice:hover { opacity: 0.8; }
        .callout-line { stroke: #2d3436; stroke-width: 1.5; fill: none; transition: all 0.5s; }
        .callout-text { font-size: 10px; font-weight: bold; fill: #2d3436; transition: all 0.5s; }

        /* --- TIMELINE SELECTOR (MIDDLE) --- */
        .timeline {
            display: flex; background: rgba(255,255,255,0.9); border-radius: 30px;
            padding: 5px; margin: 15px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .decade-btn {
            padding: 10px 30px; border: none; background: transparent; font-size: 1.2rem;
            font-family: 'Fredoka One', cursive; color: #7f8c8d; cursor: pointer; transition: all 0.3s;
            border-radius: 25px;
        }
        .decade-btn:hover, .decade-btn.active { background: #2ecc71; color: white; }

        /* --- BAR CHART (BOTTOM) --- */
        .bar-chart-container {
            flex-grow: 1; width: 100%; background: rgba(255,255,255,0.85); border-radius: 15px;
            padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; align-items: flex-end;
            justify-content: space-around; position: relative;
        }
        .bar-wrapper {
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            height: 100%; width: 8%; position: relative; cursor: pointer;
        }
        .bar {
            width: 100%; background: #3498db; border-radius: 5px 5px 0 0;
            transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.6s;
            position: relative; box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        .bar-rank { font-family: 'Fredoka One', cursive; margin-bottom: 5px; color: #34495e; }
        
        /* Tooltip */
        .tooltip {
            position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%) translateY(-10px);
            background: #2c3e50; color: white; padding: 10px; border-radius: 8px; width: 180px;
            font-size: 0.85rem; text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 100;
        }
        .tooltip::after {
            content: ''; position: absolute; top: 100%; left: 50%; margin-left: -5px;
            border-width: 5px; border-style: solid; border-color: #2c3e50 transparent transparent transparent;
        }
        .bar-wrapper:hover .tooltip { opacity: 1; }
        .tooltip-name { font-weight: bold; color: #f1c40f; margin-bottom: 4px; font-size: 1rem; }
        .tooltip-nw { font-weight: bold; margin-bottom: 4px; }
        .tooltip-fact { font-style: italic; font-size: 0.75rem; }

    </style>
</head>
<body>

    <a href="index.html" class="back-btn">&#8592;</a>
    <div class="money-rain" id="rain"></div>

    <h1>FUN FACTS ABOUT BILLIONAIRES!</h1>

    <div class="dashboard">
        
        <div class="charts-container">
            <!-- Left Chart: Dual Ring -->
            <div class="chart-box">
                <div class="chart-title">Population vs. Wealth (Dual-Ring)</div>
                <svg id="dual-ring" viewBox="-100 -100 200 200"></svg>
            </div>
            
            <!-- Right Chart: Exploded Callout -->
            <div class="chart-box">
                <div class="chart-title">US Wealth Distribution (Exploded)</div>
                <svg id="exploded-pie" viewBox="-120 -100 240 200"></svg>
            </div>
        </div>

        <div class="timeline" id="timeline">
            <button class="decade-btn active" data-decade="1980">1980s</button>
            <button class="decade-btn" data-decade="1990">1990s</button>
            <button class="decade-btn" data-decade="2000">2000s</button>
            <button class="decade-btn" data-decade="2010">2010s</button>
            <button class="decade-btn" data-decade="2026">2026</button>
        </div>

        <div class="bar-chart-container" id="bars-container">
            <!-- Bars generated by JS -->
        </div>

    </div>

    <script>
        // --- DATASET ---
        const economicClasses = [
            { name: "Upper Class (Top 1%)", color: "#e74c3c", pop: 1 },
            { name: "Upper-Middle (90-99%)", color: "#e67e22", pop: 9 },
            { name: "Middle Class (50-90%)", color: "#f1c40f", pop: 40 },
            { name: "Lower-Middle (25-50%)", color: "#2ecc71", pop: 25 },
            { name: "Lower Class (0-25%)", color: "#3498db", pop: 25 }
        ];

        const decadesData = {
            "1980": {
                wealthShares: [23, 37, 36, 3, 1],
                maxWealth: 10, // For bar chart scaling
                billionaires: [
                    { name: "Sam Walton", nw: 8.7, fact: "Drove an old Ford pickup truck despite being the richest man.", link: "https://en.wikipedia.org/wiki/Sam_Walton" },
                    { name: "John Kluge", nw: 5.2, fact: "Made his fortune buying independent TV stations.", link: "https://en.wikipedia.org/wiki/John_Kluge" },
                    { name: "Ross Perot", nw: 3.0, fact: "Ran for President in 1992 and got 19% of the vote.", link: "https://en.wikipedia.org/wiki/Ross_Perot" },
                    { name: "David Packard", nw: 2.0, fact: "Started HP in a literal garage in Palo Alto.", link: "https://en.wikipedia.org/wiki/David_Packard" },
                    { name: "Warren Buffett", nw: 1.5, fact: "Still lives in the same house he bought in 1958 for $31,500.", link: "https://en.wikipedia.org/wiki/Warren_Buffett" },
                    { name: "Lester Crown", nw: 1.3, fact: "Heir to the Material Service Corporation.", link: "https://en.wikipedia.org/wiki/Lester_Crown" },
                    { name: "Edgar Bronfman", nw: 1.2, fact: "Ran Seagram, the massive liquor empire.", link: "https://en.wikipedia.org/wiki/Edgar_Bronfman_Sr." },
                    { name: "Paul Allen", nw: 1.2, fact: "Co-founded Microsoft, then bought the Seattle Seahawks.", link: "https://en.wikipedia.org/wiki/Paul_Allen" },
                    { name: "Jay Pritzker", nw: 1.1, fact: "Founded the Hyatt Hotel chain at the LAX airport.", link: "https://en.wikipedia.org/wiki/Jay_Pritzker" },
                    { name: "Marvin Davis", nw: 1.0, fact: "An oilman who owned 20th Century Fox.", link: "https://en.wikipedia.org/wiki/Marvin_Davis" }
                ]
            },
            "1990": {
                wealthShares: [28, 36, 33, 2.5, 0.5],
                maxWealth: 90,
                billionaires: [
                    { name: "Bill Gates", nw: 85.0, fact: "Wrote his first computer program (Tic-Tac-Toe) at age 13.", link: "https://en.wikipedia.org/wiki/Bill_Gates" },
                    { name: "Warren Buffett", nw: 31.0, fact: "Drinks five cans of Coca-Cola every single day.", link: "https://en.wikipedia.org/wiki/Warren_Buffett" },
                    { name: "Paul Allen", nw: 30.0, fact: "Played electric guitar and built a museum for Jimi Hendrix.", link: "https://en.wikipedia.org/wiki/Paul_Allen" },
                    { name: "Steven Ballmer", nw: 19.5, fact: "Microsoft's 30th employee; known for screaming on stage.", link: "https://en.wikipedia.org/wiki/Steve_Ballmer" },
                    { name: "Michael Dell", nw: 16.5, fact: "Started selling upgrade kits out of his dorm room.", link: "https://en.wikipedia.org/wiki/Michael_Dell" },
                    { name: "Robson Walton", nw: 15.8, fact: "Eldest son of Walmart founder Sam Walton.", link: "https://en.wikipedia.org/wiki/S._Robson_Walton" },
                    { name: "Jim Walton", nw: 15.8, fact: "Ran Arvest Bank, the Walton family's personal bank.", link: "https://en.wikipedia.org/wiki/Jim_Walton" },
                    { name: "John Walton", nw: 15.8, fact: "A former Green Beret medic in the Vietnam War.", link: "https://en.wikipedia.org/wiki/John_T._Walton" },
                    { name: "Alice Walton", nw: 15.5, fact: "Opened a massive American Art museum in Arkansas.", link: "https://en.wikipedia.org/wiki/Alice_Walton" },
                    { name: "Larry Ellison", nw: 13.0, fact: "Dropped out of college twice and founded Oracle.", link: "https://en.wikipedia.org/wiki/Larry_Ellison" }
                ]
            },
            "2000": {
                wealthShares: [28, 38, 32, 2.0, 0],
                maxWealth: 60,
                billionaires: [
                    { name: "Bill Gates", nw: 50.0, fact: "Bought Leonardo da Vinci's journal for $30 million.", link: "https://en.wikipedia.org/wiki/Bill_Gates" },
                    { name: "Warren Buffett", nw: 40.0, fact: "Spends 80% of his day just reading.", link: "https://en.wikipedia.org/wiki/Warren_Buffett" },
                    { name: "Larry Ellison", nw: 27.0, fact: "Raced yachts and won the America's Cup.", link: "https://en.wikipedia.org/wiki/Larry_Ellison" },
                    { name: "Jim Walton", nw: 23.7, fact: "Still largely avoids the press entirely.", link: "https://en.wikipedia.org/wiki/Jim_Walton" },
                    { name: "Robson Walton", nw: 23.7, fact: "Purchased the Denver Broncos NFL team.", link: "https://en.wikipedia.org/wiki/S._Robson_Walton" },
                    { name: "Alice Walton", nw: 23.7, fact: "Bred championship cutting horses.", link: "https://en.wikipedia.org/wiki/Alice_Walton" },
                    { name: "Christy Walton", nw: 23.7, fact: "Inherited her fortune when her husband died in a plane crash.", link: "https://en.wikipedia.org/wiki/Christy_Walton" },
                    { name: "Michael Bloomberg", nw: 17.5, fact: "Was fired from Salomon Brothers, used his severance to start Bloomberg L.P.", link: "https://en.wikipedia.org/wiki/Michael_Bloomberg" },
                    { name: "Charles Koch", nw: 16.0, fact: "Co-owns the second largest privately held company in the US.", link: "https://en.wikipedia.org/wiki/Charles_Koch" },
                    { name: "David Koch", nw: 16.0, fact: "Survived a deadly commercial plane crash in 1991.", link: "https://en.wikipedia.org/wiki/David_Koch" }
                ]
            },
            "2010": {
                wealthShares: [31, 38, 29, 2.0, 0],
                maxWealth: 120,
                billionaires: [
                    { name: "Jeff Bezos", nw: 114.0, fact: "Amazon originally only sold books.", link: "https://en.wikipedia.org/wiki/Jeff_Bezos" },
                    { name: "Bill Gates", nw: 106.0, fact: "Has donated over $50 billion to charity.", link: "https://en.wikipedia.org/wiki/Bill_Gates" },
                    { name: "Warren Buffett", nw: 80.8, fact: "Pledged to give away 99% of his fortune.", link: "https://en.wikipedia.org/wiki/Warren_Buffett" },
                    { name: "Mark Zuckerberg", nw: 69.6, fact: "Facebook is blue because Mark is red-green colorblind.", link: "https://en.wikipedia.org/wiki/Mark_Zuckerberg" },
                    { name: "Larry Ellison", nw: 65.0, fact: "Bought 98% of the Hawaiian island of Lanai.", link: "https://en.wikipedia.org/wiki/Larry_Ellison" },
                    { name: "Larry Page", nw: 55.5, fact: "Co-founded Google; named it after the number 'Googol'.", link: "https://en.wikipedia.org/wiki/Larry_Page" },
                    { name: "Sergey Brin", nw: 53.5, fact: "Met Larry Page at a Stanford orientation; they argued the whole time.", link: "https://en.wikipedia.org/wiki/Sergey_Brin" },
                    { name: "Michael Bloomberg", nw: 53.4, fact: "Served as Mayor of New York City for 12 years.", link: "https://en.wikipedia.org/wiki/Michael_Bloomberg" },
                    { name: "Steve Ballmer", nw: 51.7, fact: "Bought the LA Clippers for $2 billion.", link: "https://en.wikipedia.org/wiki/Steve_Ballmer" },
                    { name: "Jim Walton", nw: 51.6, fact: "Youngest son of Walmart founder Sam Walton.", link: "https://en.wikipedia.org/wiki/Jim_Walton" }
                ]
            },
            "2026": {
                wealthShares: [32, 37, 28, 2.5, 0.5],
                maxWealth: 250,
                billionaires: [
                    { name: "Elon Musk", nw: 240.0, fact: "Taught himself computer programming at age 12.", link: "https://en.wikipedia.org/wiki/Elon_Musk" },
                    { name: "Jeff Bezos", nw: 195.0, fact: "Flew to space in his own rocket in 2021.", link: "https://en.wikipedia.org/wiki/Jeff_Bezos" },
                    { name: "Mark Zuckerberg", nw: 170.0, fact: "Trained in Brazilian Jiu-Jitsu.", link: "https://en.wikipedia.org/wiki/Mark_Zuckerberg" },
                    { name: "Larry Ellison", nw: 140.0, fact: "Owns a massive collection of samurai armor.", link: "https://en.wikipedia.org/wiki/Larry_Ellison" },
                    { name: "Warren Buffett", nw: 130.0, fact: "Still plays the ukulele at shareholder meetings.", link: "https://en.wikipedia.org/wiki/Warren_Buffett" },
                    { name: "Bill Gates", nw: 125.0, fact: "Owns roughly 275,000 acres of farmland in the US.", link: "https://en.wikipedia.org/wiki/Bill_Gates" },
                    { name: "Steve Ballmer", nw: 120.0, fact: "Known for his extremely enthusiastic basketball sideline reactions.", link: "https://en.wikipedia.org/wiki/Steve_Ballmer" },
                    { name: "Larry Page", nw: 115.0, fact: "Invested heavily in flying car startups.", link: "https://en.wikipedia.org/wiki/Larry_Page" },
                    { name: "Sergey Brin", nw: 110.0, fact: "Funded a project to create lab-grown meat.", link: "https://en.wikipedia.org/wiki/Sergey_Brin" },
                    { name: "Michael Bloomberg", nw: 105.0, fact: "His financial terminals are on Wall Street desks worldwide.", link: "https://en.wikipedia.org/wiki/Michael_Bloomberg" }
                ]
            }
        };

        // --- BACKGROUND RAIN ---
        const rainContainer = document.getElementById('rain');
        for(let i=0; i<30; i++){
            let bill = document.createElement('div');
            bill.className = 'bill';
            bill.innerText = '$';
            bill.style.left = Math.random() * 100 + 'vw';
            bill.style.animationDuration = (Math.random() * 5 + 5) + 's';
            bill.style.animationDelay = (Math.random() * 5) + 's';
            rainContainer.appendChild(bill);
        }

        // --- CHART DRAWING HELPERS ---
        function getCoordinatesForPercent(percent, radius) {
            const x = Math.cos(2 * Math.PI * percent - Math.PI / 2) * radius;
            const y = Math.sin(2 * Math.PI * percent - Math.PI / 2) * radius;
            return [x, y];
        }

        // --- DRAW CHARTS ---
        function updateCharts(decadeKey) {
            const data = decadesData[decadeKey];
            const dualRing = document.getElementById('dual-ring');
            const exploded = document.getElementById('exploded-pie');
            
            dualRing.innerHTML = ''; exploded.innerHTML = '';

            let popAcc = 0; let wealthAcc = 0;

            economicClasses.forEach((cls, i) => {
                const wealthShare = Math.max(data.wealthShares[i], 0.5); // Ensure tiny slices are visible
                const popPct = cls.pop / 100;
                const wealthPct = wealthShare / 100;

                // 1. Dual Ring Logic (Inner = Pop, Outer = Wealth)
                const innerRadius = 50; const outerRadius = 80;
                
                // Inner Ring (Population)
                const [ix1, iy1] = getCoordinatesForPercent(popAcc, innerRadius);
                const [ix2, iy2] = getCoordinatesForPercent(popAcc + popPct, innerRadius);
                const iLarge = popPct > 0.5 ? 1 : 0;
                const iPath = `<path d="M 0 0 L ${ix1} ${iy1} A ${innerRadius} ${innerRadius} 0 ${iLarge} 1 ${ix2} ${iy2} Z" fill="${cls.color}" class="slice" opacity="0.6"/>`;
                
                // Outer Ring (Wealth)
                const [ox1, oy1] = getCoordinatesForPercent(wealthAcc, outerRadius);
                const [ox2, oy2] = getCoordinatesForPercent(wealthAcc + wealthPct, outerRadius);
                const oLarge = wealthPct > 0.5 ? 1 : 0;
                const oPath = `<path d="M 0 0 L ${ox1} ${oy1} A ${outerRadius} ${outerRadius} 0 ${oLarge} 1 ${ox2} ${oy2} Z" fill="${cls.color}" class="slice"/>`;
                
                dualRing.innerHTML += iPath + oPath;

                // 2. Exploded Callout Logic
                const pieRadius = 60;
                const [px1, py1] = getCoordinatesForPercent(wealthAcc, pieRadius);
                const [px2, py2] = getCoordinatesForPercent(wealthAcc + wealthPct, pieRadius);
                const pLarge = wealthPct > 0.5 ? 1 : 0;
                const piePath = `<path d="M 0 0 L ${px1} ${py1} A ${pieRadius} ${pieRadius} 0 ${pLarge} 1 ${px2} ${py2} Z" fill="${cls.color}" class="slice"/>`;
                exploded.innerHTML += piePath;

                // Exploded Callout Lines
                const midAngle = wealthAcc + (wealthPct / 2);
                const [lx1, ly1] = getCoordinatesForPercent(midAngle, pieRadius - 10);
                const [lx2, ly2] = getCoordinatesForPercent(midAngle, pieRadius + 15);
                const lineExtX = lx2 > 0 ? lx2 + 20 : lx2 - 20; // Extend left or right
                
                const textAnchor = lx2 > 0 ? "start" : "end";
                const line = `<polyline points="${lx1},${ly1} ${lx2},${ly2} ${lineExtX},${ly2}" class="callout-line"/>`;
                const textName = `<text x="${lineExtX + (lx2>0?5:-5)}" y="${ly2 - 4}" class="callout-text" text-anchor="${textAnchor}">${cls.name}</text>`;
                const textVal = `<text x="${lineExtX + (lx2>0?5:-5)}" y="${ly2 + 8}" class="callout-text" text-anchor="${textAnchor}">Wealth: ${wealthShare}%</text>`;

                exploded.innerHTML += line + textName + textVal;

                popAcc += popPct;
                wealthAcc += wealthPct;
            });
        }

        // --- DRAW BAR CHART ---
        const barsContainer = document.getElementById('bars-container');
        
        // Initialize HTML structure for 10 bars
        for(let i=0; i<10; i++) {
            barsContainer.innerHTML += `
                <div class="bar-wrapper" onclick="openWiki(${i})">
                    <div class="bar-rank">#${i+1}</div>
                    <div class="bar" id="bar-${i}"></div>
                    <div class="tooltip" id="tip-${i}">
                        <div class="tooltip-name"></div>
                        <div class="tooltip-nw"></div>
                        <div class="tooltip-fact"></div>
                        <div style="font-size:0.65rem; margin-top:5px; color:#bdc3c7;">(Click for Wiki)</div>
                    </div>
                </div>
            `;
        }

        let currentWikiLinks = [];
        function openWiki(index) { if(currentWikiLinks[index]) window.open(currentWikiLinks[index], '_blank'); }

        function updateBars(decadeKey) {
            const data = decadesData[decadeKey];
            const colors = ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#1abc9c', '#3498db', '#9b59b6', '#34495e', '#7f8c8d', '#bdc3c7'];
            
            data.billionaires.forEach((b, i) => {
                const bar = document.getElementById(`bar-${i}`);
                const tipName = document.querySelector(`#tip-${i} .tooltip-name`);
                const tipNw = document.querySelector(`#tip-${i} .tooltip-nw`);
                const tipFact = document.querySelector(`#tip-${i} .tooltip-fact`);

                // Calculate height percentage relative to the MAX wealth of that decade
                const heightPct = Math.max((b.nw / data.maxWealth) * 100, 5); 
                
                bar.style.height = `${heightPct}%`;
                bar.style.backgroundColor = colors[i];
                
                tipName.innerText = b.name;
                tipNw.innerText = `$${b.nw} Billion`;
                tipFact.innerText = b.fact;
                
                currentWikiLinks[i] = b.link;
            });
        }

        // --- EVENT LISTENERS ---
        document.querySelectorAll('.decade-btn').forEach(btn => {
            btn.addEventListener('mouseenter', (e) => {
                document.querySelectorAll('.decade-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                const dec = e.target.getAttribute('data-decade');
                updateCharts(dec);
                updateBars(dec);
            });
            // Support for mobile tapping
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.decade-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                const dec = e.target.getAttribute('data-decade');
                updateCharts(dec);
                updateBars(dec);
            });
        });

        // Initialize First View
        updateCharts("1980");
        updateBars("1980");

    </script>
</body>
</html>
