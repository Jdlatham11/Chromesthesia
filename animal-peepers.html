<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Peepers</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: #fdfbf7; /* Warm parchment background */
            color: #2d3436;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px; /* Sketchbook dot grid */
        }

        .back-btn {
            position: absolute; top: 20px; left: 20px;
            color: #2d3436; text-decoration: none; font-size: 28px;
            font-weight: bold; transition: transform 0.2s ease;
        }
        .back-btn:hover { transform: translateX(-5px); }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- MAIN LAYOUT --- */
        .layout-container {
            display: flex;
            width: 90%;
            max-width: 1200px;
            height: 55vh;
            margin-top: 30px;
            gap: 20px;
        }

        /* --- LEFT SIDE: INFO PANEL --- */
        .info-panel {
            flex: 1;
            background: #ffffff;
            padding: 25px;
            /* Hand-drawn sketchy border */
            border: 3px solid #2d3436;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            box-shadow: 4px 4px 0px #cbd5e1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-panel h2 {
            font-family: 'Fredoka One', cursive;
            color: #d35400;
            font-size: 1.8rem;
            border-bottom: 2px dashed #cbd5e1;
            padding-bottom: 10px;
        }

        .data-label { font-weight: bold; color: #7f8c8d; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }
        .data-value { font-size: 1.1rem; margin-bottom: 5px; }
        
        .description-box {
            margin-top: 10px;
            font-style: italic;
            line-height: 1.6;
            color: #475569;
        }

        /* --- RIGHT SIDE: VIDEO PLAYER --- */
        .video-panel {
            flex: 2;
            background: #000;
            border: 4px solid #2d3436;
            border-radius: 8px 255px 5px 225px/255px 5px 225px 8px;
            box-shadow: 6px 6px 0px #94a3b8;
            position: relative;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .tv-static {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-radial-gradient(#222 0 0.0001%, #111 0 0.0002%) 50% 0/2500px 2500px, repeating-conic-gradient(#222 0 0.0001%, #111 0 0.0002%) 50% 50%/2500px 2500px;
            background-blend-mode: difference;
            display: flex; align-items: center; justify-content: center;
            color: white; font-family: 'Fredoka One', cursive; font-size: 1.5rem;
            z-index: 10;
        }

        /* --- LOWER THIRD BUTTON --- */
        .button-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .peeper-btn {
            background: #2ecc71;
            color: white;
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            padding: 15px 40px;
            border: 3px solid #2d3436;
            border-radius: 255px 20px 225px 20px/20px 225px 20px 255px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #27ae60;
            transition: all 0.1s ease-in-out;
            text-transform: uppercase;
        }

        .peeper-btn:hover { background: #27ae60; transform: translateY(2px); box-shadow: 2px 2px 0px #1e8449; }
        .peeper-btn:active { transform: translateY(4px); box-shadow: 0px 0px 0px #1e8449; }

    </style>
</head>
<body>

    <a href="index.html" class="back-btn">&#8592;</a>

    <h1>Animal Peepers</h1>

    <div class="layout-container">
        <!-- Left Side: Info -->
        <div class="info-panel">
            <h2 id="stream-title">Awaiting Signal...</h2>
            
            <div>
                <div class="data-label">Location</div>
                <div class="data-value" id="stream-location">Unknown</div>
            </div>

            <div>
                <div class="data-label">Broadcaster</div>
                <div class="data-value" id="stream-source">None</div>
            </div>

            <div>
                <div class="data-label">Field Notes</div>
                <div class="description-box" id="stream-desc">
                    Click the button below to tap into a random animal live stream network.
                </div>
            </div>
        </div>

        <!-- Right Side: Video -->
        <div class="video-panel">
            <div class="tv-static" id="tv-static">PRESS BUTTON TO TUNE IN</div>
            <iframe id="video-player" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <div class="button-container">
        <button class="peeper-btn" id="tune-btn">Find Animals!</button>
    </div>

    <script>
        // --- THE DATABASE ---
        // To add a new stream, find a YouTube live stream, copy the 11-character video ID from the URL (v=XXXXXXXXXXX), and add it below.
        const streams = [
            {
                id: "nD6B_lI5QyI", 
                title: "Kitten Rescue Cam",
                location: "Los Angeles, California",
                source: "Explore.org",
                desc: "A live look inside the Kitten Rescue Sanctuary. You will usually find litters of rescued kittens playing, sleeping in piles, and causing absolute chaos while they wait for adoption."
            },
            {
                id: "B80v2MIM8yE",
                title: "Tembe Elephant Park",
                location: "KwaZulu-Natal, South Africa",
                source: "Africam",
                desc: "A hidden watering hole in the dense African bush. Watch for the famous 'Big Tuskers' (elephants with massive tusks), along with lions, leopards, and rhinos gathering for a drink."
            },
            {
                id: "2gBWj9ign8A",
                title: "Sea Otter Cam",
                location: "Monterey Bay, California",
                source: "Monterey Bay Aquarium",
                desc: "Live feed of the resident sea otters. They spend their days rolling in the water, grooming their thick fur, and vigorously smashing clam shells against their chests."
            },
            {
                id: "F10wQkE_LqI",
                title: "Manatee Underwater Cam",
                location: "Homosassa Springs, Florida",
                source: "Save the Manatee Club",
                desc: "An underwater view of a warm Florida spring. During the winter months, hundreds of wild manatees gather here to escape the cold ocean waters. They are essentially giant aquatic potatoes."
            }
        ];

        // --- THE LOGIC ---
        const tuneBtn = document.getElementById('tune-btn');
        const staticScreen = document.getElementById('tv-static');
        const videoPlayer = document.getElementById('video-player');
        
        const titleEl = document.getElementById('stream-title');
        const locationEl = document.getElementById('stream-location');
        const sourceEl = document.getElementById('stream-source');
        const descEl = document.getElementById('stream-desc');

        let lastStreamIndex = -1;

        tuneBtn.addEventListener('click', () => {
            // Hide the static screen
            staticScreen.style.display = 'none';

            // Pick a random stream (making sure it's not the exact same one twice in a row)
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * streams.length);
            } while (randomIndex === lastStreamIndex && streams.length > 1);
            
            lastStreamIndex = randomIndex;
            const selectedStream = streams[randomIndex];

            // Update the Left Panel Info
            titleEl.innerText = selectedStream.title;
            locationEl.innerText = selectedStream.location;
            sourceEl.innerText = selectedStream.source;
            descEl.innerText = selectedStream.desc;

            // Update the YouTube iframe
            // We append ?autoplay=1&mute=1 to force the video to start playing immediately
            videoPlayer.src = `https://www.youtube.com/embed/${selectedStream.id}?autoplay=1&mute=1`;
        });
    </script>
</body>
</html>
